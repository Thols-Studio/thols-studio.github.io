const palettePicker = document.getElementById('palettePicker');
const paletteReverse = document.getElementById('paletteReverse');
function getSeqPalette(){
  const name = palettePicker && PALETTES[palettePicker.value] ? palettePicker.value : 'default';
  const arr = PALETTES[name].seq.slice();
  return (paletteReverse && paletteReverse.checked) ? arr.reverse() : arr;
}
function getFlowPalette(){
  const name = palettePicker && PALETTES[palettePicker.value] ? palettePicker.value : 'default';
  const arr = PALETTES[name].flow.slice();
  return (paletteReverse && paletteReverse.checked) ? arr.reverse() : arr;
}

// Converts a palette hex color to a low-alpha rgba() string for the
// "outlined badge" box style: tinted fill, full-strength colored border,
// full-strength colored text — rather than a solid-filled box.
function withAlpha(hex, alpha){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
// A light 14% tint reads as a soft pastel against a white canvas, but the
// same 14% against a dark canvas is nearly invisible — a color needs much
// more of itself mixed in before it registers as a "tinted box" rather than
// just noise on a dark background. Badges use this instead of a flat alpha
// so both themes get an equally legible tint, just calibrated differently.
function badgeTint(hex){
  const dark = themePicker && ['dark', 'console', 'classic'].includes(themePicker.value);
  return withAlpha(hex, dark ? 0.30 : 0.14);
}

function colorizeSequence(){
  const svg = hostEl.querySelector('svg');
  if(!svg) return;
  const SEQ_PALETTE = getSeqPalette();

  // In Mermaid 0.16.x the `.actor` class sits directly on the box <rect> and
  // on the label <text> — they are siblings, not nested in a wrapper <g>.
  const actorRects = svg.querySelectorAll('rect.actor');
  const actorTexts = svg.querySelectorAll('text.actor');
  // Not a sequence diagram (or no actors): bail out.
  if(!actorRects.length) return;

  // Mermaid embeds a <style> block with rules like
  //   #g2 .actor{ fill:#ECECFF; }
  //   #g2 text.actor>tspan{ fill:black; }
  // CSS beats presentation attributes, so setting fill="" attributes has no
  // visible effect. We instead tag each element with data-lane (derived from
  // x-position so a column's top & bottom boxes share a lane) and inject our
  // own <style> with !important, which wins over Mermaid's rule.
  const xCentres = [];
  actorRects.forEach(rect => {
    const x = parseFloat(rect.getAttribute('x')) || 0;
    const w = parseFloat(rect.getAttribute('width')) || 0;
    xCentres.push(Math.round(x + w / 2));
  });
  // Assign a lane index to each distinct x centre, in left-to-right order.
  const laneByX = new Map();
  [...new Set(xCentres)].sort((a, b) => a - b).forEach((cx, i) => laneByX.set(cx, i));
  const sortedUnique = [...laneByX.keys()].sort((a, b) => a - b);

  actorRects.forEach((rect, i) => {
    rect.setAttribute('data-lane', String(laneByX.get(xCentres[i]) ?? 0));
  });

  // Tag the vertical lifelines so each takes its object's colour. In Mermaid
  // 0.16.x the lifelines are <line> elements where x1 === x2; match each to the
  // nearest actor lane by its x position. Horizontal message arrows (x1 !== x2)
  // are left untouched — they span two objects.
  const laneXOf = (x) => {
    let bestLane = 0, bestDist = Infinity;
    sortedUnique.forEach((cx, idx) => {
      const d = Math.abs(cx - x);
      if(d < bestDist){ bestDist = d; bestLane = idx; }
    });
    return bestLane;
  };

  // Mermaid draws each lifeline starting a few px from the very top of the
  // diagram (behind the top actor box) and relies on that box being opaque
  // to hide the overlap — same at the bottom. Our actor boxes are now
  // semi-transparent tinted badges, so that hidden overlap becomes visible.
  // Trim each lifeline's real y1/y2 to the actual box edges instead.
  const topEdgeByLane = new Map();
  const bottomEdgeByLane = new Map();
  svg.querySelectorAll('rect.actor-top').forEach(rect => {
    const x = parseFloat(rect.getAttribute('x')) || 0;
    const w = parseFloat(rect.getAttribute('width')) || 0;
    const y = parseFloat(rect.getAttribute('y')) || 0;
    const h = parseFloat(rect.getAttribute('height')) || 0;
    topEdgeByLane.set(laneXOf(x + w / 2), y + h);
  });
  svg.querySelectorAll('rect.actor-bottom').forEach(rect => {
    const x = parseFloat(rect.getAttribute('x')) || 0;
    const w = parseFloat(rect.getAttribute('width')) || 0;
    const y = parseFloat(rect.getAttribute('y')) || 0;
    bottomEdgeByLane.set(laneXOf(x + w / 2), y);
  });
  svg.querySelectorAll('line').forEach(line => {
    const x1 = parseFloat(line.getAttribute('x1'));
    const x2 = parseFloat(line.getAttribute('x2'));
    if(isNaN(x1) || isNaN(x2) || Math.abs(x1 - x2) >= 1) return; // vertical lifelines only
    const lane = laneXOf(x1);
    if(topEdgeByLane.has(lane)) line.setAttribute('y1', String(topEdgeByLane.get(lane)));
    if(bottomEdgeByLane.has(lane)) line.setAttribute('y2', String(bottomEdgeByLane.get(lane)));
  });

  svg.querySelectorAll('line').forEach(line => {
    const x1 = parseFloat(line.getAttribute('x1'));
    const x2 = parseFloat(line.getAttribute('x2'));
    if(isNaN(x1) || isNaN(x2)) return;
    if(Math.abs(x1 - x2) < 1){          // vertical lifeline
      line.setAttribute('data-lane', String(laneXOf(x1)));
    }
  });

  // Tag activation rectangles (the thin bars showing object is active) with
  // their owner's lane so they inherit the object colour.
  svg.querySelectorAll('rect[class^="activation"]').forEach(rect => {
    const x = parseFloat(rect.getAttribute('x')) || 0;
    const w = parseFloat(rect.getAttribute('width')) || 0;
    rect.setAttribute('data-lane', String(laneXOf(x + w / 2)));
  });

  // Message arrows + their text labels: colour them by their SOURCE object's
  // lane (the actor nearest the arrow's start x1). The arrows themselves are
  // invisible lines (stroke:none) whose visible parts are shared <marker>
  // shapes (#arrowhead, #sequencenumber). Markers render in an isolated
  // context and don't inherit colour from the line, so we clone the shared
  // markers once per lane, tint each clone, and repoint every arrow's
  // marker-start/marker-end to its source-lane clone.
  const NS = 'http://www.w3.org/2000/svg';
  let defs = svg.querySelector('defs');
  if(!defs){
    defs = document.createElementNS(NS, 'defs');
    svg.insertBefore(defs, svg.firstChild);
  }
  const tplArrow = svg.querySelector('#arrowhead');
  const tplSeq   = svg.querySelector('#sequencenumber');
  // Clear any clones from a previous render.
  defs.querySelectorAll('[data-seq-clone]').forEach(el => el.remove());

  const cloneMarker = (tpl, id, lane) => {
    if(!tpl) return null;
    const clone = tpl.cloneNode(true);
    clone.setAttribute('id', id);
    clone.setAttribute('data-seq-clone', '1');
    const c = SEQ_PALETTE[lane % SEQ_PALETTE.length];
    clone.querySelectorAll('path, circle').forEach(el => {
      el.setAttribute('fill', c.fill);
      el.setAttribute('stroke', c.fill);
    });
    defs.appendChild(clone);
    return clone;
  };
  // Pre-create a coloured clone per lane for both marker kinds.
  const lanesPresent = new Set();
  svg.querySelectorAll('line').forEach(line => {
    const me = line.getAttribute('marker-end') || line.getAttribute('marker-start');
    if(!me) return;
    const x1 = parseFloat(line.getAttribute('x1'));
    if(isNaN(x1)) return;
    lanesPresent.add(laneXOf(x1));
  });
  lanesPresent.forEach(lane => {
    cloneMarker(tplArrow, 'arrowhead-l' + lane, lane);
    cloneMarker(tplSeq,   'sequencenumber-l' + lane, lane);
  });

  // Repoint each message arrow to its source-lane marker, and tag the arrow
  // + its label text with data-lane so the injected CSS tints the label.
  svg.querySelectorAll('line').forEach(line => {
    const me = line.getAttribute('marker-end');
    const ms = line.getAttribute('marker-start');
    if(!me && !ms) return;
    const x1 = parseFloat(line.getAttribute('x1'));
    if(isNaN(x1)) return;
    const lane = laneXOf(x1);
    if(me)  line.setAttribute('marker-end',   `url(#arrowhead-l${lane})`);
    if(ms)  line.setAttribute('marker-start', `url(#sequencenumber-l${lane})`);
    line.setAttribute('data-lane', String(lane));
  });

  // Match each message label to its arrow geometrically. Mermaid centres each
  // label on its arrow's midpoint, so label.x ~= arrow.midX; the label sits a
  // little ABOVE the arrow (label.y < arrow.y). We can't pair by document index
  // because loop/note contexts emit extra <text> elements with no arrow, so the
  // text and line counts differ. Instead, for each label find the best-matching
  // arrow: midpoint x must be close (primary signal), and among those prefer the
  // arrow closest to the label in y while still lying below it. A small x band
  // is allowed (midpoint rounds differently than the label x).
  const arrowList = [];
  svg.querySelectorAll('line').forEach(line => {
    if(line.getAttribute('marker-end') || line.getAttribute('marker-start')){
      const x1 = parseFloat(line.getAttribute('x1')) || 0;
      const x2 = parseFloat(line.getAttribute('x2')) || 0;
      arrowList.push({
        midX: (x1 + x2) / 2,
        y: parseFloat(line.getAttribute('y1')) || 0,
        lane: parseInt(line.getAttribute('data-lane'), 10)
      });
    }
  });
  svg.querySelectorAll('text.messageText').forEach(t => {
    const tx = parseFloat(t.getAttribute('x')) || 0;
    const ty = parseFloat(t.getAttribute('y')) || 0;
    let bestLane = null, bestScore = Infinity;
    arrowList.forEach(a => {
      const dx = Math.abs(a.midX - tx);
      if(dx > 12) return;                 // label not on this arrow's midpoint
      // label is above the arrow; prefer the nearest arrow below it. Weight x
      // heavily so the right arrow wins even when several share a band.
      const dy = ty - a.y;                // +ve when arrow is below label
      const penalty = dy < 0 ? 500 : 0;   // disfavour arrows above the label
      const score = dx * 5 + Math.abs(dy) + penalty;
      if(score < bestScore){ bestScore = score; bestLane = a.lane; }
    });
    if(bestLane !== null) t.setAttribute('data-lane', String(bestLane));
  });

  actorTexts.forEach(t => {
    const x = parseFloat(t.getAttribute('x')) || 0;
    let bestLane = 0, bestDist = Infinity;
    sortedUnique.forEach((cx, idx) => {
      const d = Math.abs(cx - x);
      if(d < bestDist){ bestDist = d; bestLane = idx; }
    });
    t.setAttribute('data-lane', String(bestLane));
  });

  // Remove any prior injected style so repeated renders don't accumulate.
  svg.querySelector('style#seq-colors')?.remove();
  const rules = SEQ_PALETTE.map((c, i) => {
    const tint = badgeTint(c.fill);
    return (
      // Lifelines & activation bars: solid colored lines — thin strokes
      // read fine without the tinted "badge" treatment.
      `svg [data-lane="${i}"]{fill:${c.fill}!important;stroke:${c.fill}!important;}` +
      // Actor boxes: light tinted fill + colored border + pill-rounded
      // corners, like an outlined chip rather than a solid block.
      `svg rect.actor[data-lane="${i}"]{fill:${tint}!important;stroke:${c.fill}!important;stroke-width:2px!important;rx:16px!important;ry:16px!important;}` +
      `svg text.actor[data-lane="${i}"]{fill:${c.fill}!important;font-weight:700!important;}` +
      `svg text.actor[data-lane="${i}"]>tspan{fill:${c.fill}!important;font-weight:700!important;}` +
      // Arrow message text sits on the cream canvas, so it uses the lane
      // colour itself — readable on the background and tied to its source.
      `svg text.messageText[data-lane="${i}"]{fill:${c.fill}!important;stroke:none!important;font-weight:600!important;}` +
      `svg text.messageText[data-lane="${i}"]>tspan{fill:${c.fill}!important;}`
    );
  }).join('\n');
  const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.setAttribute('id', 'seq-colors');
  style.textContent = rules;
  svg.insertBefore(style, svg.firstChild);
}

// Flowchart depth-coloring — each node's BFS depth from the root(s) picks
// a color from the flow palette. The palette uses distinct hues per slot
// (not a gradient), so nodes at different depths read as clearly different
// colors rather than a smooth ramp.
function colorizeFlowchart(){
  const svg = hostEl.querySelector('svg');
  if(!svg) return;
  const FLOW_PALETTE = getFlowPalette();

  // Flowchart nodes render with id="flowchart-<name>-<n>" — scoping to this
  // prefix (rather than the generic g.node[data-id] shape) matters because
  // state diagrams ALSO use g.node[data-id] with their own "state-" prefix;
  // without this we'd misfire on state diagrams too.
  const nodes = Array.from(svg.querySelectorAll('g.node[id^="flowchart-"]'));
  if(!nodes.length) return;

  const allIds = new Set(nodes.map(n => n.getAttribute('data-id')));
  const adj = new Map();
  const indeg = new Map();
  allIds.forEach(id => { adj.set(id, []); indeg.set(id, 0); });

  // Edge paths are rendered with id="L-<source>-<target>-<n>" and carry
  // "LS-<source>" / "LE-<target>" classes — the classes are the reliable
  // signal since node names themselves may contain hyphens.
  const edgePaths = Array.from(svg.querySelectorAll('path[id^="L-"]'));
  const edgeInfo = [];
  edgePaths.forEach(path => {
    const classes = (path.getAttribute('class') || '').split(/\s+/);
    let src = null, tgt = null;
    classes.forEach(c => {
      if(c.startsWith('LS-')) src = c.slice(3);
      if(c.startsWith('LE-')) tgt = c.slice(3);
    });
    if(src && tgt && allIds.has(src) && allIds.has(tgt)){
      adj.get(src).push(tgt);
      indeg.set(tgt, (indeg.get(tgt) || 0) + 1);
      edgeInfo.push({ path, src, tgt });
    }
  });

  // BFS depth from every zero-indegree node (there may be several parallel
  // starts). Any node an edge never reaches becomes its own extra root, so
  // disconnected clusters still get sensible (0-based) depths rather than
  // being skipped.
  const depth = new Map();
  const bfsFrom = (startIds) => {
    const queue = [...startIds];
    startIds.forEach(id => { if(!depth.has(id)) depth.set(id, 0); });
    while(queue.length){
      const cur = queue.shift();
      const d = depth.get(cur);
      (adj.get(cur) || []).forEach(next => {
        if(!depth.has(next)){ depth.set(next, d + 1); queue.push(next); }
      });
    }
  };
  let roots = [...allIds].filter(id => (indeg.get(id) || 0) === 0);
  if(!roots.length && nodes.length) roots = [nodes[0].getAttribute('data-id')];
  bfsFrom(roots);
  allIds.forEach(id => { if(!depth.has(id)) bfsFrom([id]); });

  nodes.forEach(n => {
    const d = depth.get(n.getAttribute('data-id')) || 0;
    n.setAttribute('data-depth', String(d % FLOW_PALETTE.length));
  });

  // Recolor arrowheads the same way colorizeSequence() does: SVG markers
  // render in an isolated context and won't inherit color from the path
  // that references them, so clone each referenced marker once per depth
  // and repoint marker-start/marker-end at the tinted clone.
  const NS = 'http://www.w3.org/2000/svg';
  let defs = svg.querySelector('defs');
  if(!defs){ defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  defs.querySelectorAll('[data-flow-clone]').forEach(el => el.remove());
  const cloneCache = new Map();
  const ensureClone = (originalId, d) => {
    const key = originalId + '__' + d;
    if(cloneCache.has(key)) return cloneCache.get(key);
    const tpl = svg.getElementById ? svg.getElementById(originalId) : svg.querySelector('#' + CSS.escape(originalId));
    if(!tpl) return null;
    const clone = tpl.cloneNode(true);
    const cloneId = 'flowclone-' + d + '-' + originalId.replace(/[^a-zA-Z0-9]/g, '');
    clone.setAttribute('id', cloneId);
    clone.setAttribute('data-flow-clone', '1');
    const c = FLOW_PALETTE[d % FLOW_PALETTE.length];
    clone.querySelectorAll('path, circle').forEach(el => {
      el.setAttribute('fill', c.fill);
      el.setAttribute('stroke', c.fill);
    });
    defs.appendChild(clone);
    cloneCache.set(key, cloneId);
    return cloneId;
  };

  edgeInfo.forEach(({ path, src }) => {
    const d = (depth.get(src) || 0) % FLOW_PALETTE.length;
    path.setAttribute('data-depth', String(d));
    ['marker-start', 'marker-end'].forEach(attr => {
      const val = path.getAttribute(attr);
      const m = val && val.match(/url\(#([^)]+)\)/);
      if(!m) return;
      const cloneId = ensureClone(m[1], d);
      if(cloneId) path.setAttribute(attr, `url(#${cloneId})`);
    });
  });

  // Edge labels ("Yes"/"No" etc.) render in the same left-to-right order as
  // their edge paths, so pair them up by index to tint the label text too.
  const edgeLabelGroups = Array.from(svg.querySelectorAll('.edgeLabels > .edgeLabel'));
  edgeLabelGroups.forEach((g, i) => {
    const info = edgeInfo[i];
    if(!info) return;
    g.setAttribute('data-depth', String(depth.get(info.src) % FLOW_PALETTE.length || 0));
  });

  svg.querySelector('style#flow-colors')?.remove();
  const rules = FLOW_PALETTE.map((c, i) => {
    const tint = badgeTint(c.fill);
    return (
      `svg g.node[data-depth="${i}"] > rect, svg g.node[data-depth="${i}"] > polygon, ` +
      `svg g.node[data-depth="${i}"] > circle, svg g.node[data-depth="${i}"] > path{ fill:${tint}!important; stroke:${c.fill}!important; stroke-width:2px!important; }` +
      `svg g.node[data-depth="${i}"] > rect{ rx:8px!important; ry:8px!important; }` +
      `svg g.node[data-depth="${i}"] .nodeLabel{ color:${c.fill}!important; font-weight:600!important; }` +
      `svg path[data-depth="${i}"]{ stroke:${c.fill}!important; }` +
      `svg .edgeLabel[data-depth="${i}"] .edgeLabel{ color:${c.fill}!important; font-weight:600!important; }`
    );
  }).join('\n') +
    // Subgraphs/clusters aren't part of the depth graph (they're containers,
    // not nodes) — give them a soft neutral tint distinct from any node
    // color so nesting reads clearly without competing with the gradient.
    `\nsvg g.cluster rect{ fill:rgba(139,127,240,0.06)!important; stroke:rgba(139,127,240,0.35)!important; stroke-dasharray:4,3!important; }`;
  const style = document.createElementNS(NS, 'style');
  style.setAttribute('id', 'flow-colors');
  style.textContent = rules;
  svg.insertBefore(style, svg.firstChild);
}

// State diagrams: Mermaid's SVG output for transitions doesn't encode
// source/target (edges are just id="edge0", "edge1"...), unlike flowcharts.
// So instead of reading the SVG, we parse the raw diagram source for
// "A --> B" lines to rebuild the transition graph, then BFS depth from
// [*] (the state machine's start) the same way colorizeFlowchart does.
function colorizeState(sourceText){
  const svg = hostEl.querySelector('svg');
  if(!svg) return;
  // Exclude the [*] start/end pseudo-states (rendered as small solid
  // circles with class "state-start"/"state-end") — they aren't real
  // states, and coloring them would break the standard state-diagram
  // convention of a plain filled dot marking the entry/exit point.
  const nodes = Array.from(svg.querySelectorAll('g.node[id^="state-"]'))
    .filter(n => !n.querySelector('.state-start, .state-end'));
  if(!nodes.length) return;
  const FLOW_PALETTE = getFlowPalette();

  const allIds = new Set(nodes.map(n => n.getAttribute('data-id')));
  const adj = new Map();
  allIds.forEach(id => adj.set(id, []));

  const transRe = /^\s*([\w.]+|\[\*\])\s*-->\s*([\w.]+|\[\*\])\s*(?::.*)?$/;
  const transitions = [];
  sourceText.split('\n').forEach(line => {
    const m = line.match(transRe);
    if(m) transitions.push({ src: m[1], tgt: m[2] });
  });

  const starts = new Set();
  transitions.forEach(({ src, tgt }) => {
    if(src === '[*]'){ if(allIds.has(tgt)) starts.add(tgt); return; }
    if(tgt === '[*]') return;
    if(allIds.has(src) && allIds.has(tgt)) adj.get(src).push(tgt);
  });

  const depth = new Map();
  const bfsFrom = (startIds) => {
    const queue = [...startIds];
    startIds.forEach(id => { if(!depth.has(id)) depth.set(id, 0); });
    while(queue.length){
      const cur = queue.shift();
      const d = depth.get(cur);
      (adj.get(cur) || []).forEach(next => {
        if(!depth.has(next)){ depth.set(next, d + 1); queue.push(next); }
      });
    }
  };
  let roots = [...starts];
  if(!roots.length && nodes.length) roots = [nodes[0].getAttribute('data-id')];
  bfsFrom(roots);
  allIds.forEach(id => { if(!depth.has(id)) bfsFrom([id]); });

  nodes.forEach(n => {
    const d = depth.get(n.getAttribute('data-id')) || 0;
    n.setAttribute('data-depth', String(d % FLOW_PALETTE.length));
  });

  // Transitions render in the same order they're declared, so pair each
  // rendered edge path with its parsed transition by index to tint it and
  // its arrowhead by the source state's depth color.
  const NS = 'http://www.w3.org/2000/svg';
  let defs = svg.querySelector('defs');
  if(!defs){ defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  defs.querySelectorAll('[data-state-clone]').forEach(el => el.remove());
  const cache = new Map();
  const ensureClone = (originalId, d) => {
    const key = originalId + '__' + d;
    if(cache.has(key)) return cache.get(key);
    const tpl = svg.getElementById ? svg.getElementById(originalId) : svg.querySelector('#' + CSS.escape(originalId));
    if(!tpl) return null;
    const clone = tpl.cloneNode(true);
    const cloneId = 'stateclone-' + d + '-' + originalId.replace(/[^a-zA-Z0-9]/g, '');
    clone.setAttribute('id', cloneId);
    clone.setAttribute('data-state-clone', '1');
    const c = FLOW_PALETTE[d % FLOW_PALETTE.length];
    clone.querySelectorAll('path, circle').forEach(el => { el.setAttribute('fill', c.fill); el.setAttribute('stroke', c.fill); });
    defs.appendChild(clone);
    cache.set(key, cloneId);
    return cloneId;
  };
  const edgeEls = Array.from(svg.querySelectorAll('path.transition[id^="edge"]'));
  edgeEls.forEach((path, i) => {
    const t = transitions[i];
    if(!t) return;
    const d = t.src === '[*]' ? 0 : (depth.get(t.src) || 0) % FLOW_PALETTE.length;
    path.setAttribute('data-depth', String(d));
    ['marker-start', 'marker-end'].forEach(attr => {
      const val = path.getAttribute(attr);
      const m = val && val.match(/url\(#([^)]+)\)/);
      if(!m) return;
      const cloneId = ensureClone(m[1], d);
      if(cloneId) path.setAttribute(attr, `url(#${cloneId})`);
    });
  });

  svg.querySelector('style#state-colors')?.remove();
  const rules = FLOW_PALETTE.map((c, i) => {
    const tint = badgeTint(c.fill);
    return (
      `svg g.node[data-depth="${i}"] > rect, svg g.node[data-depth="${i}"] > polygon, ` +
      `svg g.node[data-depth="${i}"] > circle, svg g.node[data-depth="${i}"] > path{ fill:${tint}!important; stroke:${c.fill}!important; stroke-width:2px!important; }` +
      `svg g.node[data-depth="${i}"] > rect{ rx:14px!important; ry:14px!important; }` +
      `svg g.node[data-depth="${i}"] .nodeLabel{ color:${c.fill}!important; font-weight:600!important; }` +
      `svg path.transition[data-depth="${i}"]{ stroke:${c.fill}!important; }`
    );
  }).join('\n');
  const style = document.createElementNS(NS, 'style');
  style.setAttribute('id', 'state-colors');
  style.textContent = rules;
  svg.insertBefore(style, svg.firstChild);
}

// Class diagrams: nodes render with id="classId-<Name>-<n>" and relation
// edges render with id="id_<Source>_<Target>_<n>". There's no clean depth
// concept for a class graph (inheritance direction varies by arrow type,
// and diagrams aren't always trees), so each class gets a distinct color by
// declaration order instead — relations are tinted by their source class.
function colorizeClassDiagram(){
  const svg = hostEl.querySelector('svg');
  if(!svg) return;
  const nodes = Array.from(svg.querySelectorAll('g.node[id^="classId-"]'));
  if(!nodes.length) return;
  const PAL = getSeqPalette();

  const idxByName = new Map();
  nodes.forEach((n, i) => {
    const idx = i % PAL.length;
    n.setAttribute('data-idx', String(idx));
    idxByName.set(n.getAttribute('data-id'), idx);
  });

  // Edge id "id_Diagram_Flowchart_1" → source "Diagram", target "Flowchart".
  // Assumes class names don't themselves contain underscores.
  const edgePaths = Array.from(svg.querySelectorAll('path[id^="id_"]'));
  const NS = 'http://www.w3.org/2000/svg';
  let defs = svg.querySelector('defs');
  if(!defs){ defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  defs.querySelectorAll('[data-class-clone]').forEach(el => el.remove());
  const cache = new Map();
  const ensureClone = (originalId, idx) => {
    const key = originalId + '__' + idx;
    if(cache.has(key)) return cache.get(key);
    const tpl = svg.getElementById ? svg.getElementById(originalId) : svg.querySelector('#' + CSS.escape(originalId));
    if(!tpl) return null;
    const clone = tpl.cloneNode(true);
    const cloneId = 'classclone-' + idx + '-' + originalId.replace(/[^a-zA-Z0-9]/g, '');
    clone.setAttribute('id', cloneId);
    clone.setAttribute('data-class-clone', '1');
    const c = PAL[idx % PAL.length];
    clone.querySelectorAll('path, circle').forEach(el => { el.setAttribute('fill', c.fill); el.setAttribute('stroke', c.fill); });
    defs.appendChild(clone);
    cache.set(key, cloneId);
    return cloneId;
  };
  edgePaths.forEach(path => {
    const raw = path.id.replace(/^id_/, '');
    const parts = raw.split('_');
    if(parts.length < 3) return;
    parts.pop();
    const src = parts[0];
    if(!idxByName.has(src)) return;
    const idx = idxByName.get(src);
    path.setAttribute('data-idx', String(idx));
    ['marker-start', 'marker-end'].forEach(attr => {
      const val = path.getAttribute(attr);
      const m = val && val.match(/url\(#([^)]+)\)/);
      if(!m) return;
      const cloneId = ensureClone(m[1], idx);
      if(cloneId) path.setAttribute(attr, `url(#${cloneId})`);
    });
  });

  svg.querySelector('style#class-colors')?.remove();
  const rules = PAL.map((c, i) => {
    const tint = badgeTint(c.fill);
    return (
      `svg g.node[data-idx="${i}"] > rect, svg g.node[data-idx="${i}"] > polygon, ` +
      `svg g.node[data-idx="${i}"] > circle, svg g.node[data-idx="${i}"] > path{ fill:${tint}!important; stroke:${c.fill}!important; stroke-width:2px!important; }` +
      `svg g.node[data-idx="${i}"] > rect{ rx:8px!important; ry:8px!important; }` +
      `svg g.node[data-idx="${i}"] line.divider{ stroke:${c.fill}!important; opacity:0.45; }` +
      `svg g.node[data-idx="${i}"] .nodeLabel{ color:${c.fill}!important; font-weight:600!important; }` +
      `svg path[data-idx="${i}"]{ stroke:${c.fill}!important; }`
    );
  }).join('\n');
  const style = document.createElementNS(NS, 'style');
  style.setAttribute('id', 'class-colors');
  style.textContent = rules;
  svg.insertBefore(style, svg.firstChild);
}

// ER diagrams: entities render as <g id="entity-NAME-<uuid>"> with a real
// SVG <text class="er entityLabel"> (not a foreignObject span, so a plain
// `fill` handles contrast). Relationship lines carry no reference back to
// their entities in the SVG, so — unlike the other colorizers — we can only
// color the entity boxes themselves, not tint each relationship line by
// which two entities it connects.
function colorizeER(){
  const svg = hostEl.querySelector('svg');
  if(!svg) return;
  const entities = Array.from(svg.querySelectorAll('g[id^="entity-"]'));
  if(!entities.length) return;
  const PAL = getSeqPalette();

  entities.forEach((g, i) => g.setAttribute('data-idx', String(i % PAL.length)));

  svg.querySelector('style#er-colors')?.remove();
  const rules = PAL.map((c, i) => {
    const tint = badgeTint(c.fill);
    return (
      `svg g[id^="entity-"][data-idx="${i}"] rect.er.entityBox{ fill:${tint}!important; stroke:${c.fill}!important; stroke-width:2px!important; rx:8px!important; ry:8px!important; }` +
      `svg g[id^="entity-"][data-idx="${i}"] text.er.entityLabel{ fill:${c.fill}!important; font-weight:600!important; }`
    );
  }).join('\n');
  const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.setAttribute('id', 'er-colors');
  style.textContent = rules;
  svg.insertBefore(style, svg.firstChild);
}

let errorLine = null;
let shouldFitOnNextRender = false;

// --- Undo / redo history for the code editor. Checkpoints are taken once
// per render (already debounced by typing speed), not per keystroke — that
// keeps the stack a manageable size while still capturing every meaningful
// pause in editing, the same granularity most text editors use. ---
let codeHistory = [];
let historyIndex = -1;
let suppressHistoryPush = false;
function pushHistory(code){
  if(suppressHistoryPush) return;
  if(codeHistory[historyIndex] === code) return;
  codeHistory = codeHistory.slice(0, historyIndex + 1);
  codeHistory.push(code);
  if(codeHistory.length > 100) codeHistory.shift();
  historyIndex = codeHistory.length - 1;
  updateUndoRedoButtons();
}
function undoCode(){
  if(historyIndex <= 0) return;
  historyIndex--;
  suppressHistoryPush = true;
  loadCode(codeHistory[historyIndex], { fit: false });
  suppressHistoryPush = false;
  updateUndoRedoButtons();
}
function redoCode(){
  if(historyIndex >= codeHistory.length - 1) return;
  historyIndex++;
  suppressHistoryPush = true;
  loadCode(codeHistory[historyIndex], { fit: false });
  suppressHistoryPush = false;
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  document.getElementById('undoBtn').disabled = historyIndex <= 0;
  document.getElementById('redoBtn').disabled = historyIndex >= codeHistory.length - 1;
}

async function render(){
  if(typeof window.mermaid === 'undefined') return;
  const src = codeEl.value.trim();
  pushHistory(codeEl.value);
  updateLineNumbers();
  renderHighlight();
  if(!src){
    hostEl.innerHTML = '';
    errorBar.style.display = 'none';
    statusEl.classList.remove('error');
    statusText.textContent = 'Empty';
    errorLine = null;
    updateLineNumbers();
    return;
  }
  const id = 'g' + (++renderSeq);
  try{
    const { svg } = await mermaid.render(id, src);
    hostEl.innerHTML = svg;
    colorizeSequence();
    colorizeFlowchart();
    colorizeState(src);
    colorizeClassDiagram();
    colorizeER();
    lastGoodSvg = hostEl.innerHTML;
    errorBar.style.display = 'none';
    statusEl.classList.remove('error');
    statusText.textContent = 'Rendered';
    errorLine = null;
    updateLineNumbers();
    autosave();
    if(shouldFitOnNextRender){ shouldFitOnNextRender = false; fitToView(); }
    syncEditorToDiagram();
  }catch(err){
    const msg = (err && err.message) ? err.message : 'Could not parse diagram.';
    errorBar.style.display = 'block';
    errorBar.textContent = msg.split('\n').slice(0,4).join('\n');
    statusEl.classList.add('error');
    statusText.textContent = 'Syntax error';
    const lineMatch = msg.match(/line\s+(\d+)/i);
    errorLine = lineMatch ? parseInt(lineMatch[1], 10) : null;
    updateLineNumbers();
    const stray = document.getElementById(id);
    if(stray) stray.remove();
  }
}

// ---------------------------------------------------------------------
// NaN-safe SVG coordinate extraction (see NaN_Validation_Logic.md).
//
// The doc's original approach walked each SVG ancestor by hand, summing
// getBBox().y plus any transform="translate(...)" found at every level.
// Testing it against this app's actual bundled Mermaid confirmed two
// real bugs in that approach, not just theoretical ones:
//   1. Mermaid nests several *untransformed* wrapper groups (a real
//      rendered flowchart node sits at root > g.nodes > g.node). Each
//      wrapper's own getBBox() already reflects its transformed
//      children's rendered position, so summing one more getBBox().y
//      per level re-adds the same offset instead of computing it once —
//      the box landed 2-3x further down/right than the real node.
//   2. Every rendered diagram's <svg> carries a non-zero viewBox origin
//      (e.g. viewBox="-50 -10 450 226" on a real sequence diagram) that
//      manual attribute-parsing never accounted for at all.
// getScreenCTM() asks the browser to compose the *entire* transform
// chain itself — nested group transforms, the viewBox, and any CSS
// transform on HTML ancestors (our own pan/zoom included) — so neither
// failure mode can happen, regardless of how deep the nesting goes.
// ---------------------------------------------------------------------
function getElementScreenBox(el){
  if(!el || !el.getBBox || !el.getScreenCTM || !el.ownerSVGElement) return null;
  let box, ctm;
  try{
    box = el.getBBox();
    ctm = el.getScreenCTM();
  }catch(e){
    return null; // getBBox/getScreenCTM can throw if the element isn't actually rendered yet.
  }
  if(!box || !ctm) return null;
  if([box.x, box.y, box.width, box.height].some(v => isNaN(v) || !isFinite(v))) return null;

  // Map all four corners (not just top-left) through the CTM, so this
  // stays correct even if a future diagram type introduces rotation —
  // today's content is axis-aligned, but this doesn't assume that.
  const svgRoot = el.ownerSVGElement;
  const pt = svgRoot.createSVGPoint();
  const corners = [
    [box.x, box.y], [box.x + box.width, box.y],
    [box.x, box.y + box.height], [box.x + box.width, box.y + box.height]
  ];
  const screenPts = [];
  for(const [x, y] of corners){
    pt.x = x; pt.y = y;
    const p = pt.matrixTransform(ctm);
    if(!isFinite(p.x) || !isFinite(p.y)) return null;
    screenPts.push(p);
  }
  const xs = screenPts.map(p => p.x), ys = screenPts.map(p => p.y);
  const left = Math.min(...xs), top = Math.min(...ys);
  const width = Math.max(...xs) - left, height = Math.max(...ys) - top;
  if(!isFinite(left) || !isFinite(top) || !isFinite(width) || !isFinite(height)) return null;
  return { left, top, width, height };
}

// ---------------------------------------------------------------------
// Bi-directional editor <-> diagram sync (see
// Bi_Directional_Sync_Implementation_Guide.md):
//   A. Editor -> Diagram — moving the cursor highlights the matching node.
//   B. Diagram -> Editor — clicking a node selects the matching source line.
//
// #diagram-selection-box lives inside #canvas-inner as a sibling of
// #diagram-host (see the CSS comment above it), so it's carried along by
// the exact same `translate(...) scale(zoom)` transform the diagram
// itself gets from applyTransform(). getElementScreenBox already returns
// true on-screen pixels (it composes that same CSS transform via
// getScreenCTM), so positioning the box is just "subtract #canvas-inner's
// own screen position, then undo its scale" — panX/panY never need to be
// read directly.
// ---------------------------------------------------------------------
const selectionBox = document.getElementById('diagram-selection-box');

// Places the box over one SVG element, or several unioned together (used
// for a message: its label and its arrow are two separate elements with
// no shared wrapper — see syncEditorToDiagram below). Validates every
// measurement first — a broken box is worse than no box, so any
// NaN/non-finite value just hides it instead.
function positionSelectionBox(elements){
  const els = Array.isArray(elements) ? elements : [elements];
  let screenBox = null;
  for(const el of els){
    const b = getElementScreenBox(el);
    if(!b) continue;
    if(!screenBox){
      screenBox = b;
    }else{
      const left = Math.min(screenBox.left, b.left);
      const top = Math.min(screenBox.top, b.top);
      const right = Math.max(screenBox.left + screenBox.width, b.left + b.width);
      const bottom = Math.max(screenBox.top + screenBox.height, b.top + b.height);
      screenBox = { left, top, width: right - left, height: bottom - top };
    }
  }
  if(!screenBox || screenBox.height === 0){
    selectionBox.style.display = 'none';
    return;
  }
  if(!zoom || !isFinite(zoom) || zoom <= 0){
    selectionBox.style.display = 'none';
    return;
  }

  const innerRect = innerEl.getBoundingClientRect();
  const left = (screenBox.left - innerRect.left) / zoom;
  const top = (screenBox.top - innerRect.top) / zoom;
  const width = screenBox.width / zoom;
  const height = screenBox.height / zoom;
  if([left, top, width, height].some(v => isNaN(v) || !isFinite(v))){
    selectionBox.style.display = 'none';
    return;
  }

  selectionBox.style.display = 'block';
  selectionBox.style.left = left + 'px';
  selectionBox.style.top = top + 'px';
  selectionBox.style.width = width + 'px';
  selectionBox.style.height = height + 'px';
}

// Direction A: reads the current line under the cursor and highlights
// whichever rendered SVG node's text matches it.
function syncEditorToDiagram(){
  const svgEl = hostEl.querySelector('svg');
  if(!svgEl){ selectionBox.style.display = 'none'; return; }

  const text = codeEl.value;
  const cursorIndex = codeEl.selectionStart;
  const lineStart = text.lastIndexOf('\n', cursorIndex - 1) + 1;
  let lineEnd = text.indexOf('\n', cursorIndex);
  if(lineEnd === -1) lineEnd = text.length;
  const currentLineText = text.substring(lineStart, lineEnd).trim();

  if(!currentLineText){ selectionBox.style.display = 'none'; return; }

  // Sequence-diagram message lines (`A->>B: text`) contain both actors'
  // names as substrings of the source line, and actor labels render
  // earlier in the SVG than message labels do — so scanning every <text>
  // node in document order would match a short actor name (checked
  // second, below) before ever reaching the message it's actually part
  // of. Message labels are checked first and specifically so a message
  // line always matches its own arrow rather than an actor it mentions.
  const messageTextNodes = svgEl.querySelectorAll('text.messageText');
  for(const node of messageTextNodes){
    const t = node.textContent;
    if(t && (t.includes(currentLineText) || currentLineText.includes(t))){
      // Confirmed against real rendered output: Mermaid always draws a
      // message's label immediately before its arrow (a <line> for a
      // normal message, a <path> for a self-message loop) as the very
      // next sibling — there's no shared wrapper element to select
      // instead, so the box has to be the union of both elements.
      const arrow = node.nextElementSibling;
      const hasArrow = arrow && (arrow.getAttribute('class') || '').includes('messageLine');
      positionSelectionBox(hasArrow ? [node, arrow] : [node]);
      return;
    }
  }

  const svgTextNodes = svgEl.querySelectorAll('text');
  let matchedElement = null;
  for(const node of svgTextNodes){
    const t = node.textContent;
    if(t && (t.includes(currentLineText) || currentLineText.includes(t))){
      // A .node group (flowchart/state/class/ER) or, failing that, the
      // element right before the text (typically the actor rect in
      // sequence diagrams) — covers every diagram type this editor renders.
      matchedElement = node.closest('.node') || node.previousElementSibling;
      break;
    }
  }

  if(!matchedElement){ selectionBox.style.display = 'none'; return; }
  positionSelectionBox(matchedElement);
}
codeEl.addEventListener('keyup', syncEditorToDiagram);
codeEl.addEventListener('click', syncEditorToDiagram);

// Direction B: clicking a rendered node selects the matching text in
// the editor, then re-runs Direction A to draw the box over it.
function handleDiagramNodeClick(event){
  // Sequence-diagram messages are flat children of the <svg> — unlike
  // every other diagram element here, there's no wrapping .node or even
  // a plain <g> around a label+arrow pair, so closest('.node')/closest('g')
  // below would silently miss clicks on them entirely. Resolve a message
  // hit first: clicking the label matches directly, clicking the arrow
  // (<line> or <path>, for a self-message loop) looks at the label drawn
  // right before it.
  let messageLabel = event.target.closest('text.messageText');
  if(!messageLabel){
    const arrowHit = event.target.closest('line, path');
    if(arrowHit && (arrowHit.getAttribute('class') || '').includes('messageLine')){
      const prev = arrowHit.previousElementSibling;
      if(prev && prev.classList && prev.classList.contains('messageText')) messageLabel = prev;
    }
  }
  if(messageLabel){
    const msgText = messageLabel.textContent.trim();
    if(msgText){
      const editorText = codeEl.value;
      const matchIndex = editorText.indexOf(msgText);
      if(matchIndex !== -1){
        codeEl.focus();
        codeEl.setSelectionRange(matchIndex, matchIndex + msgText.length);
        syncEditorToDiagram();
      }
    }
    return;
  }

  const clickedNode = event.target.closest('.node') || event.target.closest('g');
  if(!clickedNode) return;

  const textElement = clickedNode.querySelector('text');
  if(!textElement) return;
  const nodeText = textElement.textContent.trim();
  if(!nodeText) return;

  const editorText = codeEl.value;
  const matchIndex = editorText.indexOf(nodeText);
  if(matchIndex !== -1){
    codeEl.focus();
    codeEl.setSelectionRange(matchIndex, matchIndex + nodeText.length);
    syncEditorToDiagram();
  }
}
hostEl.addEventListener('click', handleDiagramNodeClick);

let debounceTimer;
const autoUpdateToggle = document.getElementById('autoUpdateToggle');
codeEl.addEventListener('input', () => {
  updateLineNumbers();
  renderHighlight();
  if(!autoUpdateToggle.checked) return;
  clearTimeout(debounceTimer);
  // Scale the debounce with source size — large diagrams re-parse/re-layout
  // more slowly, so waiting a little longer avoids stacking renders while
  // still feeling instant for typical small diagrams.
  const delay = Math.min(900, 250 + Math.floor(codeEl.value.length / 8));
  debounceTimer = setTimeout(render, delay);
});

codeEl.addEventListener('keydown', (e) => {
  if(e.key === 'Tab'){
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0,s) + '  ' + codeEl.value.slice(en);
    codeEl.selectionStart = codeEl.selectionEnd = s+2;
    renderHighlight();
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(debounceTimer);
    render();
  } else if(mod && (e.key === 's' || e.key === 'S')){
    e.preventDefault();
    // Ctrl+S exports SVG directly (matching the original quick-export shortcut).
    if(lastGoodSvg){
      const svgEl = hostEl.querySelector('svg');
      if(svgEl){
        const clone = svgEl.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const serialized = new XMLSerializer().serializeToString(clone);
        const url = URL.createObjectURL(new Blob([serialized], {type:'image/svg+xml;charset=utf-8'}));
        const a = document.createElement('a');
        a.href = url; a.download = 'diagram.svg'; a.click();
        URL.revokeObjectURL(url);
        toast('SVG downloaded');
      }
    }
  } else if(mod && e.key === '/'){
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    const lineStart = codeEl.value.lastIndexOf('\n', s - 1) + 1;
    const lineEnd = codeEl.value.indexOf('\n', en);
    const stop = lineEnd === -1 ? codeEl.value.length : lineEnd;
    const block = codeEl.value.slice(lineStart, stop);
    const lines = block.split('\n');
    const allCommented = lines.every(l => /^\s*%%/.test(l) || l.trim() === '');
    const toggled = lines.map(l => {
      if(l.trim() === '') return l;
      return allCommented ? l.replace(/^(\s*)%%\s?/, '$1') : l.replace(/^(\s*)/, '$1%% ');
    }).join('\n');
    codeEl.value = codeEl.value.slice(0, lineStart) + toggled + codeEl.value.slice(stop);
    renderHighlight();
    updateLineNumbers();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 250);
  } else if(mod && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    undoCode();
  } else if(mod && ((e.shiftKey && (e.key === 'z' || e.key === 'Z')) || e.key === 'y' || e.key === 'Y')){
    e.preventDefault();
    redoCode();
  }
});

function applyCanvasTheme(){
  const val = themePicker.value;
  const isConsole = val === 'console';
  const isClassic = val === 'classic';
  const isDark = val === 'dark';
  // Console layers background-only overrides on top of Dark (shares its
  // text/token colors). Classic is fully independent — it has its own
  // original violet/pink/amber palette, not a background swap on Dark's
  // mermaid.ai-matched tokens — so it gets its own class, not theme-dark.
  previewPane.classList.toggle('canvas-dark', isDark || isConsole);
  previewPane.classList.toggle('canvas-console', isConsole);
  previewPane.classList.toggle('canvas-classic', isClassic);
  const mainEl = document.getElementById('main');
  mainEl.classList.toggle('theme-dark', isDark || isConsole);
  mainEl.classList.toggle('theme-console-bg', isConsole);
  mainEl.classList.toggle('theme-classic', isClassic);
  if(typeof window.mermaid === 'undefined') return;
  // Mermaid's own built-in theme covers everything our colorizers don't
  // touch (default text/line colors on class/state/ER elements outside our
  // overrides) — 'dark' gives light-on-dark defaults so those elements stay
  // legible against a dark canvas instead of rendering black-on-black.
  const isDarkFamily = isDark || isConsole || isClassic;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDarkFamily ? 'dark' : 'default', fontFamily: 'var(--font-ui)' });
}

  applyCanvasTheme();
  render();
});

// --- Persistence: autosave the current diagram, keep a small history of
// recent diagrams, and support sharing via a URL fragment. All local to
// this browser (no server involved) — this is a real downloaded file, so
// localStorage genuinely persists across sessions rather than being wiped.
const STORAGE_KEY = 'flowsmith:autosave';
const RECENT_KEY = 'flowsmith:recent';
const MAX_RECENT = 12;

function autosave(){
  try{ localStorage.setItem(STORAGE_KEY, codeEl.value); }catch(e){ /* storage unavailable — ignore */ }
  saveToRecent(codeEl.value);
}

function loadRecent(){
  try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }catch(e){ return []; }
}

function saveToRecent(code){
  if(!code.trim()) return;
  try{
    let list = loadRecent();
    list = list.filter(item => item.code !== code);
    list.unshift({ code, ts: Date.now() });
    list = list.slice(0, MAX_RECENT);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  }catch(e){ /* ignore */ }
}

function renderRecentPanel(){
  const panel = document.getElementById('recentPanel');
  const list = loadRecent();
  panel.innerHTML = '';
  if(!list.length){
    const empty = document.createElement('div');
    empty.className = 'recent-empty';
    empty.textContent = 'No saved diagrams yet — one is kept here automatically each time you edit.';
    panel.appendChild(empty);
    return;
  }
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'recent-item';
    const firstLine = item.code.split('\n').find(l => l.trim()) || '(untitled)';
    const when = new Date(item.ts).toLocaleString();
    div.textContent = firstLine.trim().slice(0, 42) + ' — ' + when;
    div.title = firstLine.trim();
    div.addEventListener('click', () => {
      loadCode(item.code);
      document.getElementById('recentPanel').classList.remove('open');
      toast('Loaded from recent');
    });
    panel.appendChild(div);
  });
}

});

// Export dispatch: routes the active format (png/svg/pdf/mmd) to the right
// builder, applies the selected background, and downloads the result. PNG
// and PDF share the svgToCanvas rasterizer; SVG serializes the live SVG;
// MMD just writes the editor's source text.
function resolveBgHex(){
  if(exportBg === 'white') return '#ffffff';
  if(exportBg === 'black') return '#000000';
  if(exportBg === 'transparent') return null;
  return exportBg;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function handleExportConfirm(){
  if(!lastGoodSvg && exportFormat !== 'mmd'){ toast('Nothing to export yet'); return; }
  const bgHex = resolveBgHex();
  const scale = parseInt(document.getElementById('exportScale').value, 10) || 2;
  if(exportFormat === 'svg'){
    const svgEl = hostEl.querySelector('svg');
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    if(bgHex) clone.style.background = bgHex; else clone.style.background = 'none';
    const serialized = new XMLSerializer().serializeToString(clone);
    downloadBlob(new Blob([serialized], {type:'image/svg+xml;charset=utf-8'}), 'diagram.svg');
    toast('SVG downloaded'); closeExportModal();
  }else if(exportFormat === 'mmd'){
    downloadBlob(new Blob([codeEl.value], {type:'text/plain;charset=utf-8'}), 'diagram.mmd');
    toast('MMD source downloaded'); closeExportModal();
  }else if(exportFormat === 'png'){
    svgToCanvas({ scale, bgHex }, (canvas) => {
      canvas.toBlob(blob => { downloadBlob(blob, 'diagram.png'); toast('PNG downloaded'); }, 'image/png');
    });
    closeExportModal();
  }else if(exportFormat === 'pdf'){
    // PDF wraps a JPEG — transparency isn't meaningful, so always fill bg.
    svgToCanvas({ scale: 2, bgHex: bgHex || '#ffffff' }, (canvas, bbox) => {
      canvas.toBlob(async (blob) => {
        const buf = new Uint8Array(await blob.arrayBuffer());
        const ptWidth = Math.round(bbox.width * 0.75);   // CSS px @ 96dpi -> pt
        const ptHeight = Math.round(bbox.height * 0.75);
        const pdfBytes = buildImagePdf(buf, canvas.width, canvas.height, ptWidth, ptHeight);
        downloadBlob(new Blob([pdfBytes], {type:'application/pdf'}), 'diagram.pdf');
        toast('PDF downloaded');
      }, 'image/jpeg', 0.92);
    });
    closeExportModal();
  }
}

// Shared rasterizer: renders the current SVG to a canvas at the given
// pixel scale, with an optional solid background fill (null = transparent).
// Used by PNG and PDF export so they can't drift apart.
function svgToCanvas({ scale, bgHex }, cb){
  if(!lastGoodSvg){ toast('Nothing to export yet'); return; }
  const svgEl = hostEl.querySelector('svg');
  const bbox = svgEl.getBoundingClientRect();
  const img = new Image();
  const svgBlob = new Blob([lastGoodSvg], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bbox.width * scale));
    canvas.height = Math.max(1, Math.round(bbox.height * scale));
    const ctx = canvas.getContext('2d');
    if(bgHex){
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, bbox.width, bbox.height);
    URL.revokeObjectURL(url);
    cb(canvas, bbox);
  };
  img.onerror = () => { toast('Image export failed'); URL.revokeObjectURL(url); };
  img.src = url;
}

// Hand-rolled single-page PDF wrapping a JPEG via the DCTDecode filter.
// JPEG bytes can be embedded in a PDF image stream completely as-is, so
// this needs no external library — just correct PDF object/xref bytes.
function buildImagePdf(jpegBytes, pixelWidth, pixelHeight, ptWidth, ptHeight){
  const enc = new TextEncoder();
  const chunks = [];
  let pos = 0;
  const offsets = [];
  function push(part){
    const bytes = typeof part === 'string' ? enc.encode(part) : part;
    chunks.push(bytes);
    pos += bytes.length;
  }
  push('%PDF-1.4\n');
  offsets[1] = pos; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = pos; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = pos; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptWidth} ${ptHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offsets[4] = pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pixelWidth} /Height ${pixelHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  push(jpegBytes);
  push('\nendstream\nendobj\n');
  const content = `q ${ptWidth} 0 0 ${ptHeight} 0 0 cm /Im0 Do Q`;
  offsets[5] = pos; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xrefStart = pos;
  push('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++) push(String(offsets[i]).padStart(10,'0') + ' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  const total = chunks.reduce((a,c)=>a+c.length,0);
  const out = new Uint8Array(total);
  let o = 0;
  for(const c of chunks){ out.set(c, o); o += c.length; }
  return out;
}

// Zoom / pan
function setZoom(z, cx, cy){
  zoom = Math.min(5, Math.max(0.2, z));
  applyTransform();
}
document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.15));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.15));

scrollEl.addEventListener('wheel', (e) => {
  if(e.ctrlKey || e.metaKey || true){
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? 0.08 : -0.08));
  }
}, { passive:false });

// Hand tool: toggles whether click-drag pans the canvas. Starts active
// (matching the default "always draggable" behavior); toggling it off is
// mainly useful once you want to click into the diagram itself without
// nudging the view — there's no separate "select" mode here, so turning it
// off just parks the cursor as a plain pointer.
const handBtn = document.getElementById('handBtn');
let handToolActive = true;
function setHandTool(active){
  handToolActive = active;
  handBtn.setAttribute('aria-pressed', String(active));
  scrollEl.style.cursor = active ? 'grab' : 'default';
}
handBtn.addEventListener('click', () => setHandTool(!handToolActive));

let isDragging = false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0;
scrollEl.addEventListener('mousedown', (e) => {
  if(!handToolActive) return;
  isDragging = true;
  scrollEl.classList.add('grabbing');
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
});
window.addEventListener('mousemove', (e) => {
  if(!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; scrollEl.classList.remove('grabbing'); });

// Fullscreen: targets #preview-pane specifically, not the whole app — this
// gives a true "diagram only" presentation mode with no toolbars in view.
// Falls back through vendor-prefixed APIs for older/other browser engines.
const fullscreenBtn = document.getElementById('fullscreenBtn');
const previewPane = document.getElementById('preview-pane');
const fsIconExpand = fullscreenBtn.innerHTML;
const fsIconCompress = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';

function getFullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement ||
    document.mozFullScreenElement || document.msFullscreenElement || null;
}
function requestFullscreenCompat(el){
  const fn = el.requestFullscreen || el.webkitRequestFullscreen ||
    el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!fn) return Promise.reject(new Error('Fullscreen API unavailable'));
  return fn.call(el);
}
function exitFullscreenCompat(){
  const fn = document.exitFullscreen || document.webkitExitFullscreen ||
    document.mozCancelFullScreen || document.msExitFullscreen;
  if(!fn) return Promise.reject(new Error('Fullscreen API unavailable'));
  return fn.call(document);
}

fullscreenBtn.addEventListener('click', () => {
  if(!getFullscreenElement()){
    requestFullscreenCompat(previewPane).catch(() => toast('Fullscreen not available — your browser or this preview may block it'));
  } else {
    exitFullscreenCompat().catch(() => {});
  }
});

// While in fullscreen, the toolbar/hint bar stay hidden until the mouse
// actually moves, then fade back out after a short idle period — same
// pattern as a video player's controls, so there's still a discoverable
// way to exit or zoom without needing to know the Esc shortcut.
let chromeHideTimer = null;
function revealChromeBriefly(){
  previewPane.classList.add('chrome-visible');
  clearTimeout(chromeHideTimer);
  chromeHideTimer = setTimeout(() => previewPane.classList.remove('chrome-visible'), 1800);
}
previewPane.addEventListener('mousemove', () => {
  if(previewPane.classList.contains('is-fullscreen')) revealChromeBriefly();
});

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, () => {
    const fsEl = getFullscreenElement();
    const active = fsEl === previewPane;
    fullscreenBtn.innerHTML = active ? fsIconCompress : fsIconExpand;
    fullscreenBtn.title = active ? 'Exit fullscreen' : 'Fullscreen';
    previewPane.classList.toggle('is-fullscreen', active);
    if(active) revealChromeBriefly();
    else { previewPane.classList.remove('chrome-visible'); clearTimeout(chromeHideTimer); }
  });
});

// Resizer
const resizer = document.getElementById('resizer');
const editorPane = document.getElementById('editor-pane');
let resizing = false;

function clampWidth(px){
  const mainRect = document.getElementById('main').getBoundingClientRect();
  return Math.min(Math.max(px, mainRect.width * 0.35), mainRect.width * 0.9);
}

resizer.addEventListener('mousedown', () => { resizing = true; resizer.classList.add('active'); });
window.addEventListener('mousemove', (e) => {
  if(!resizing) return;
  const editorRect = editorPane.getBoundingClientRect();
  editorPane.style.width = clampWidth(e.clientX - editorRect.left) + 'px';
});
window.addEventListener('mouseup', () => {
  resizing = false;
  resizer.classList.remove('active');
});

// Toggle source pane visibility. The close (X) lives in editor-head itself
// (only visible while the source pane shows); a floating "Show code" button
// appears over the canvas once hidden, so there's always a discoverable way
// back regardless of which state you're in.
const hideSourceBtn = document.getElementById('hideSourceBtn');
const showSourceBtn = document.getElementById('showSourceBtn');
let sourceHidden = false;
function setSourceHidden(hidden){
  sourceHidden = hidden;
  editorPane.style.display = hidden ? 'none' : '';
  resizer.style.display = hidden ? 'none' : '';
  showSourceBtn.style.display = hidden ? '' : 'none';
}
hideSourceBtn.addEventListener('click', () => setSourceHidden(true));

// Editor font size — scales the textarea, the syntax-highlight overlay, and
// the line-number gutter together so they stay pixel-aligned with each
// other. line-height is set as a unitless 1.6 in CSS, which already scales
// proportionally with font-size, so nothing extra is needed there.
let editorFontSize = 13;
const fontSizeLabel = document.getElementById('fontSizeLabel');
const fontSizeTrigger = document.getElementById('fontSizeTrigger');
const fontSizePopup = document.getElementById('fontSizePopup');
const fontSizeSlider = document.getElementById('fontSizeSlider');
function applyFontSize(){
  const px = editorFontSize + 'px';
  codeEl.style.fontSize = px;
  highlightCode.style.fontSize = px;
  lineNumbersEl.style.fontSize = px;
  fontSizeLabel.textContent = px;
  fontSizeSlider.value = String(editorFontSize);
}
fontSizeTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  fontSizePopup.classList.toggle('open');
});
fontSizeSlider.addEventListener('input', () => {
  editorFontSize = parseInt(fontSizeSlider.value, 10);
  applyFontSize();
});
document.addEventListener('click', () => fontSizePopup.classList.remove('open'));
fontSizePopup.addEventListener('click', (e) => e.stopPropagation());
applyFontSize();
showSourceBtn.addEventListener('click', () => setSourceHidden(false));

// init
function loadInitialCode(){
  // 1. A shared link (#d=<base64>) wins if present.
  const hashMatch = location.hash.match(/#d=(.+)/);
  if(hashMatch){
    try{
      const decoded = decodeURIComponent(atob(hashMatch[1]));
      if(decoded.trim()) return { code: decoded, source: 'link' };
    }catch(e){ /* malformed hash — fall through */ }
  }
  // 2. Otherwise resume whatever was last open in this browser.
  try{
    const saved = localStorage.getItem('flowsmith:autosave');
    if(saved && saved.trim()) return { code: saved, source: 'autosave' };
  }catch(e){ /* storage unavailable — fall through */ }
  // 3. First run: the flowchart example.
  return { code: EXAMPLES['Flowchart'], source: 'example' };
}

const initial = loadInitialCode();
codeEl.value = initial.code;
examplePicker.value = Object.keys(EXAMPLES).find(k => EXAMPLES[k] === initial.code) || '';
updateLineNumbers();
renderHighlight();
applyTransform();
shouldFitOnNextRender = true;

if(typeof mermaid === 'undefined'){
  showLoadFailure();
} else {
  document.getElementById('boot-overlay').remove();
  applyCanvasTheme();
  if(initial.source === 'link') toast('Loaded diagram from share link');
  render();
}
</script>
</body>
